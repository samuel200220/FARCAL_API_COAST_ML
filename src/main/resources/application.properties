# Application
spring.application.name=API Prédiction Tarif Taxi
server.port=8080

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.display-request-duration=true

# URLs pour Swagger (mettez l'URL de votre application Render)
farcal.openapi.dev-url=http://localhost:8080
farcal.openapi.prod-url=https://farcal-api-coast-ml-spring.onrender.com

# Activer Swagger en production (à ajuster selon l'environnement)
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Configuration du modèle ONNX
onnx.model.path=classpath:models/RandomForest_yaounde_target_encoder.onnx
onnx.model.name=RandomForest_yaounde_target_encoder.onnx

# Désactiver les tests si le modèle n'est pas disponible
spring.main.allow-bean-definition-overriding=true

# Logging
logging.level.com.yaounde.taxi=INFO
logging.level.ai.onnxruntime=WARN
